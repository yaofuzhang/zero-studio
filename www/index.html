<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zero Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header>
  <div class="h-left"><span class="h-logo">⏺</span><span class="h-brand">Zero Studio</span></div>
  <div class="h-center">
    <input type="text" id="pathInput" class="path-input" placeholder="输入或粘贴文件夹路径，回车扫描..." autofocus>
  </div>
  <div class="h-right">
    <button id="btnScan" class="h-btn primary">扫描</button>
  </div>
</header>
<main>
<div id="welcome" class="welcome active">
  <div class="welcome-icon">🔍</div>
  <h2>代码健康仪表盘</h2>
  <p>输入项目文件夹路径，一键生成完整健康报告</p>
  <div class="recent-section" id="recentSection" style="display:none">
    <div class="recent-label">最近分析的文件夹</div>
    <div id="recentList" class="recent-list"></div>
  </div>
</div>
<div id="dashboard" class="dashboard">
  <div class="d-top">
    <div class="d-score">
      <div class="ds-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#1e1e38" stroke-width="10"/><circle id="scoreArc" cx="60" cy="60" r="50" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 314" transform="rotate(-90 60 60)"/></svg><div class="ds-value" id="scoreValue">—</div></div>
      <div class="ds-label">整体健康度</div>
      <div class="ds-sub" id="scoreSub"></div>
    </div>
    <div class="d-stats">
      <div class="ds-item green"><span class="dsi-num" id="statGreen">0</span><span class="dsi-label">🟢 健康</span></div>
      <div class="ds-item yellow"><span class="dsi-num" id="statYellow">0</span><span class="dsi-label">🟡 中风险</span></div>
      <div class="ds-item red"><span class="dsi-num" id="statRed">0</span><span class="dsi-label">🔴 高风险</span></div>
      <div class="ds-item"><span class="dsi-num" id="statFiles">0</span><span class="dsi-label">文件数</span></div>
      <div class="ds-item"><span class="dsi-num" id="statLines">0</span><span class="dsi-label">代码行</span></div>
      <div class="ds-item"><span class="dsi-num" id="statTodos">0</span><span class="dsi-label">TODO</span></div>
    </div>
  </div>
  <div class="d-table-wrap">
    <table><thead><tr><th>文件</th><th class="r">评分</th><th class="r">行数</th><th class="r">CCN</th><th class="r">TODO</th></tr></thead><tbody id="fileBody"></tbody></table>
  </div>
</div>
</main><script src="app.js"></script></body></html>
